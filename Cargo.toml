[workspace]
resolver = "2"
members = ["crates/*", "npm/oxk"]

[workspace.package]
edition = "2024"
authors = ["richerfu<southsouth0929@foxmail.com>"]
license = "MIT"
description = "An ArkTS/ArkUI tool based on oxc"

[workspace.lints.clippy]
# Match OXC: `OxcDiagnostic` stays inline so diagnostic construction remains allocation-free.
result_large_err = "allow"

[workspace.dependencies]
# inner dependencies
format = { path = "crates/format" }
lint = { path = "crates/lint" }

# Oxc dependencies
oxc_allocator = { git = "https://github.com/ohos-rs/oxc", rev = "f2da22725d1c6508ad66fd5d60541bb3866a4a6e" }
oxc_ast = { git = "https://github.com/ohos-rs/oxc", rev = "f2da22725d1c6508ad66fd5d60541bb3866a4a6e", features = [
  "serialize",
] }
oxc_ast_visit = { git = "https://github.com/ohos-rs/oxc", rev = "f2da22725d1c6508ad66fd5d60541bb3866a4a6e", features = [
  "serialize",
] }
oxc_config = { git = "https://github.com/ohos-rs/oxc", rev = "f2da22725d1c6508ad66fd5d60541bb3866a4a6e" }
oxc_data_structures = { git = "https://github.com/ohos-rs/oxc", rev = "f2da22725d1c6508ad66fd5d60541bb3866a4a6e" }
oxc_diagnostics = { git = "https://github.com/ohos-rs/oxc", rev = "f2da22725d1c6508ad66fd5d60541bb3866a4a6e" }
oxc_formatter = { git = "https://github.com/ohos-rs/oxc", rev = "f2da22725d1c6508ad66fd5d60541bb3866a4a6e" }
oxc_formatter_core = { git = "https://github.com/ohos-rs/oxc", rev = "f2da22725d1c6508ad66fd5d60541bb3866a4a6e" }
oxc_formatter_json = { git = "https://github.com/ohos-rs/oxc", rev = "f2da22725d1c6508ad66fd5d60541bb3866a4a6e" }
oxc_language_server = { git = "https://github.com/ohos-rs/oxc", rev = "f2da22725d1c6508ad66fd5d60541bb3866a4a6e" }
oxc_linter = { git = "https://github.com/ohos-rs/oxc", rev = "f2da22725d1c6508ad66fd5d60541bb3866a4a6e" }
oxc_napi = { git = "https://github.com/ohos-rs/oxc", rev = "f2da22725d1c6508ad66fd5d60541bb3866a4a6e" }
oxc_parser = { git = "https://github.com/ohos-rs/oxc", rev = "f2da22725d1c6508ad66fd5d60541bb3866a4a6e" }
oxc_semantic = { git = "https://github.com/ohos-rs/oxc", rev = "f2da22725d1c6508ad66fd5d60541bb3866a4a6e" }
oxc_span = { git = "https://github.com/ohos-rs/oxc", rev = "f2da22725d1c6508ad66fd5d60541bb3866a4a6e" }
oxc_syntax = { git = "https://github.com/ohos-rs/oxc", rev = "f2da22725d1c6508ad66fd5d60541bb3866a4a6e" }
oxc_str = { git = "https://github.com/ohos-rs/oxc", rev = "f2da22725d1c6508ad66fd5d60541bb3866a4a6e" }
oxlint = { git = "https://github.com/ohos-rs/oxc", rev = "f2da22725d1c6508ad66fd5d60541bb3866a4a6e", default-features = false }

# Common dependencies
serde_json = "1.0"
serde = { version = "1", features = ["derive"] }
schemars = { package = "oxc-schemars", version = "0.9.1" }
tokio = { version = "1", features = ["full"] }
phf = { version = "0.11", features = ["macros"] }
simdutf8 = "0.1"
json-strip-comments = "3.0"
oxc-toml = "0.14"
bpaf = "0.9"
cow-utils = "0.1.3"
owo-colors = "4"
globset = "0.4"
fast-glob = "1.0.1"
ignore = { version = "0.4.25", features = ["simd-accel"] }
miette = { package = "oxc-miette", version = "3.0.0", features = [
  "fancy-no-syscall",
] }
rayon = "1.11"
walkdir = "2"
futures = "0.3"
rustc-hash = "2"
tower-lsp-server = { version = "0.23.0", features = ["proposed"] }
tracing = "0.1"

# NAPI dependencies
napi = { version = "3.0", features = ["async", "serde-json"] }
napi-derive = "3.0"
napi-build = "2"

# Optional dependencies (defined in packages that need them)
