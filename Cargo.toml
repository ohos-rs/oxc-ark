[workspace]
resolver = "2"
members = ["crates/*", "npm/oxk"]

[workspace.package]
edition = "2024"
authors = ["richerfu<southsouth0929@foxmail.com>"]
license = "MIT"
description = "An ArkTS/ArkUI tool based on oxc"

[workspace.dependencies]
# inner dependencies
format = { path = "crates/format" }
lint = { path = "crates/lint" }

# Oxc dependencies
oxc_allocator = { git = "https://github.com/ohos-rs/oxc", rev = "5caa6d54ae977b8a76ed68b8aba06b38e1c6a614" }
oxc_ast = { git = "https://github.com/ohos-rs/oxc", rev = "5caa6d54ae977b8a76ed68b8aba06b38e1c6a614", features = [
  "serialize",
] }
oxc_ast_visit = { git = "https://github.com/ohos-rs/oxc", rev = "5caa6d54ae977b8a76ed68b8aba06b38e1c6a614", features = [
  "serialize",
] }
oxc_config_discovery = { git = "https://github.com/ohos-rs/oxc", rev = "5caa6d54ae977b8a76ed68b8aba06b38e1c6a614" }
oxc_diagnostics = { git = "https://github.com/ohos-rs/oxc", rev = "5caa6d54ae977b8a76ed68b8aba06b38e1c6a614" }
oxc_formatter = { git = "https://github.com/ohos-rs/oxc", rev = "5caa6d54ae977b8a76ed68b8aba06b38e1c6a614" }
oxc_linter = { git = "https://github.com/ohos-rs/oxc", rev = "5caa6d54ae977b8a76ed68b8aba06b38e1c6a614" }
oxc_napi = { git = "https://github.com/ohos-rs/oxc", rev = "5caa6d54ae977b8a76ed68b8aba06b38e1c6a614" }
oxc_parser = { git = "https://github.com/ohos-rs/oxc", rev = "5caa6d54ae977b8a76ed68b8aba06b38e1c6a614" }
oxc_semantic = { git = "https://github.com/ohos-rs/oxc", rev = "5caa6d54ae977b8a76ed68b8aba06b38e1c6a614" }
oxc_span = { git = "https://github.com/ohos-rs/oxc", rev = "5caa6d54ae977b8a76ed68b8aba06b38e1c6a614" }
oxc_syntax = { git = "https://github.com/ohos-rs/oxc", rev = "5caa6d54ae977b8a76ed68b8aba06b38e1c6a614" }
oxc_str = { git = "https://github.com/ohos-rs/oxc", rev = "5caa6d54ae977b8a76ed68b8aba06b38e1c6a614" }
oxlint = { git = "https://github.com/ohos-rs/oxc", rev = "5caa6d54ae977b8a76ed68b8aba06b38e1c6a614", default-features = false }

# Json5format dependencies
json5format = { git = "https://github.com/ohos-rs/json5format", rev = "26e00bd18181ead25022cf12df7af1bd68b6fb74" }


# Common dependencies
serde_json = "1.0"
serde = { version = "1", features = ["derive"] }
tokio = { version = "1", features = ["full"] }
phf = { version = "0.11", features = ["macros"] }
simdutf8 = "0.1"
json-strip-comments = "3.0"
oxc-toml = "0.14"
bpaf = "0.9"
cow-utils = "0.1.3"
owo-colors = "4"
globset = "0.4"
ignore = { version = "0.4.25", features = ["simd-accel"] }
miette = { package = "oxc-miette", version = "2.7.1", features = [
  "fancy-no-syscall",
] }
rayon = "1.11"
walkdir = "2"
futures = "0.3"
rustc-hash = "2"

# NAPI dependencies
napi = { version = "3.0", features = ["async", "serde-json"] }
napi-derive = "3.0"
napi-build = "2"

# Optional dependencies (defined in packages that need them)
