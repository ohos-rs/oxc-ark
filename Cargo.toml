[workspace]
resolver = "2"
members = ["crates/*", "npm/oxk"]

[workspace.package]
edition = "2024"
authors = ["richerfu<southsouth0929@foxmail.com>"]
license = "MIT"
description = "An ArkTS/ArkUI tool based on oxc"

[workspace.lints.clippy]
# Keep upstream-compatible diagnostic/configuration error types.
result_large_err = "allow"

[workspace.dependencies]
# inner dependencies
format = { path = "crates/format" }
lint = { path = "crates/lint" }

# Oxc dependencies
oxc_allocator = { git = "https://github.com/ohos-rs/oxc", rev = "230deff13c3d0baddb9560ba895ee2b6a3fc4b7e" }
oxc_ast = { git = "https://github.com/ohos-rs/oxc", rev = "230deff13c3d0baddb9560ba895ee2b6a3fc4b7e", features = [
  "serialize",
] }
oxc_ast_visit = { git = "https://github.com/ohos-rs/oxc", rev = "230deff13c3d0baddb9560ba895ee2b6a3fc4b7e", features = [
  "serialize",
] }
oxc_config = { git = "https://github.com/ohos-rs/oxc", rev = "230deff13c3d0baddb9560ba895ee2b6a3fc4b7e" }
oxc_data_structures = { git = "https://github.com/ohos-rs/oxc", rev = "230deff13c3d0baddb9560ba895ee2b6a3fc4b7e" }
oxc_diagnostics = { git = "https://github.com/ohos-rs/oxc", rev = "230deff13c3d0baddb9560ba895ee2b6a3fc4b7e" }
oxc_formatter = { git = "https://github.com/ohos-rs/oxc", rev = "230deff13c3d0baddb9560ba895ee2b6a3fc4b7e" }
oxc_formatter_core = { git = "https://github.com/ohos-rs/oxc", rev = "230deff13c3d0baddb9560ba895ee2b6a3fc4b7e" }
oxc_formatter_json = { git = "https://github.com/ohos-rs/oxc", rev = "230deff13c3d0baddb9560ba895ee2b6a3fc4b7e" }
oxc_language_server = { git = "https://github.com/ohos-rs/oxc", rev = "230deff13c3d0baddb9560ba895ee2b6a3fc4b7e" }
oxc_linter = { git = "https://github.com/ohos-rs/oxc", rev = "230deff13c3d0baddb9560ba895ee2b6a3fc4b7e" }
oxc_napi = { git = "https://github.com/ohos-rs/oxc", rev = "230deff13c3d0baddb9560ba895ee2b6a3fc4b7e" }
oxc_parser = { git = "https://github.com/ohos-rs/oxc", rev = "230deff13c3d0baddb9560ba895ee2b6a3fc4b7e" }
oxc_semantic = { git = "https://github.com/ohos-rs/oxc", rev = "230deff13c3d0baddb9560ba895ee2b6a3fc4b7e" }
oxc_span = { git = "https://github.com/ohos-rs/oxc", rev = "230deff13c3d0baddb9560ba895ee2b6a3fc4b7e" }
oxc_syntax = { git = "https://github.com/ohos-rs/oxc", rev = "230deff13c3d0baddb9560ba895ee2b6a3fc4b7e" }
oxc_str = { git = "https://github.com/ohos-rs/oxc", rev = "230deff13c3d0baddb9560ba895ee2b6a3fc4b7e" }
oxlint = { git = "https://github.com/ohos-rs/oxc", rev = "230deff13c3d0baddb9560ba895ee2b6a3fc4b7e", default-features = false }

oxc_formatter_css = { git = "https://github.com/ohos-rs/oxc", rev = "230deff13c3d0baddb9560ba895ee2b6a3fc4b7e" }
oxc_formatter_graphql = { git = "https://github.com/ohos-rs/oxc", rev = "230deff13c3d0baddb9560ba895ee2b6a3fc4b7e" }
oxc_formatter_markdown = { git = "https://github.com/ohos-rs/oxc", rev = "230deff13c3d0baddb9560ba895ee2b6a3fc4b7e" }
oxc_formatter_toml = { git = "https://github.com/ohos-rs/oxc", rev = "230deff13c3d0baddb9560ba895ee2b6a3fc4b7e" }
oxc_formatter_yaml = { git = "https://github.com/ohos-rs/oxc", rev = "230deff13c3d0baddb9560ba895ee2b6a3fc4b7e" }

# Common dependencies
serde_json = "1.0"
serde = { version = "1", features = ["derive"] }
schemars = { package = "oxc-schemars", version = "0.9.1" }
tokio = { version = "1", features = ["full"] }
phf = { version = "0.11", features = ["macros"] }
simdutf8 = "0.1"
json-strip-comments = "3.0"
oxc-toml = "0.15"
bpaf = "0.9"
cow-utils = "0.1.3"
owo-colors = "4"
globset = "0.4"
fast-glob = "1.1.1"
ignore = { version = "0.4.25", features = ["simd-accel"] }
rayon = "1.11"
walkdir = "2"
futures = "0.3"
rustc-hash = "2"
tower-lsp-server = { version = "0.24.0-rc.1", features = ["url-fluent-uri"] }
tracing = "0.1"

# NAPI dependencies
napi = { version = "3.0", features = ["async", "serde-json"] }
napi-derive = "3.0"
napi-build = "2"

# Optional dependencies (defined in packages that need them)

# Native format parsers use the registry allocator; unify it with the ohos fork.
[patch.crates-io]
oxc_allocator = { git = "https://github.com/ohos-rs/oxc", rev = "230deff13c3d0baddb9560ba895ee2b6a3fc4b7e" }
