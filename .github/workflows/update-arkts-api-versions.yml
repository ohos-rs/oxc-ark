name: Update ArkTS API Versions

'on':
  workflow_dispatch:
    inputs:
      sdk_archive_url:
        description: URL of a tar.gz containing sdk-pkg.json and both openharmony/ets and hms/ets declarations at its root
        required: true
        type: string
      sdk_archive_sha256:
        description: SHA256 of the SDK declaration archive
        required: true
        type: string
      api_version:
        description: Expected SDK API version (checked against sdk-pkg.json)
        required: true
        default: '26'
        type: string

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: update-arkts-api-versions
  cancel-in-progress: false

jobs:
  update:
    name: Update from HarmonyOS API ${{ inputs.api_version }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout default branch
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.repository.default_branch }}

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Download complete SDK declarations
        env:
          SDK_ARCHIVE_URL: ${{ inputs.sdk_archive_url }}
          SDK_ARCHIVE_SHA256: ${{ inputs.sdk_archive_sha256 }}
        run: |
          curl --fail --location --proto '=https' "$SDK_ARCHIVE_URL" --output "$RUNNER_TEMP/sdk.tar.gz"
          printf '%s  %s\n' "$SDK_ARCHIVE_SHA256" "$RUNNER_TEMP/sdk.tar.gz" | sha256sum --check --strict
          mkdir -p "$RUNNER_TEMP/api-sdk"
          tar --extract --gzip --file "$RUNNER_TEMP/sdk.tar.gz" --directory "$RUNNER_TEMP/api-sdk" --no-same-owner
          test -f "$RUNNER_TEMP/api-sdk/sdk-pkg.json"
          for vendor in openharmony hms; do
            test -d "$RUNNER_TEMP/api-sdk/$vendor/ets/api"
            test -d "$RUNNER_TEMP/api-sdk/$vendor/ets/kits"
          done

      - name: Generate and independently verify all API versions
        env:
          EXPECTED_API_VERSION: ${{ inputs.api_version }}
        run: |
          pnpm run test:api-versions
          node scripts/sync-arkts-system-api-versions.mjs "$RUNNER_TEMP/api-sdk" --api-version "$EXPECTED_API_VERSION"
          node scripts/verify-arkts-system-api-versions.mjs "$RUNNER_TEMP/api-sdk"
          node scripts/sync-arkts-system-api-versions.mjs "$RUNNER_TEMP/api-sdk" --api-version "$EXPECTED_API_VERSION" --check

      - name: Check for updates
        id: changes
        shell: bash
        run: |
          if git diff --quiet -- crates/lint/src/arkts/system_api_versions.rs; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "The generated ArkTS API version table is already up to date."
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Create pull request
        if: steps.changes.outputs.changed == 'true'
        uses: peter-evans/create-pull-request@v8
        with:
          add-paths: crates/lint/src/arkts/system_api_versions.rs
          base: ${{ github.event.repository.default_branch }}
          branch: automation/update-arkts-api-versions-${{ inputs.api_version }}
          delete-branch: true
          commit-message: 'chore(arkts): update API versions from HarmonyOS API ${{ inputs.api_version }}'
          title: 'chore(arkts): update API versions from HarmonyOS API ${{ inputs.api_version }}'
          body: |
            Update the built-in ArkTS system API version table from the complete HarmonyOS API `${{ inputs.api_version }}` SDK.

            - SDK declaration archive SHA256: `${{ inputs.sdk_archive_sha256 }}`
            - API version: `${{ inputs.api_version }}`

            This pull request was generated by the `Update ArkTS API Versions` workflow.
