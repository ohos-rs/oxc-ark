name: Update ArkTS API Versions

'on':
  workflow_dispatch:
    inputs:
      ohos_sdk_version:
        description: OpenHarmony SDK release version (for example, 6.1)
        required: true
        default: '6.1'
        type: string

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: update-arkts-api-versions
  cancel-in-progress: false

jobs:
  update:
    name: Update from OpenHarmony SDK ${{ inputs.ohos_sdk_version }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout default branch
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.repository.default_branch }}

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22

      - name: Setup OpenHarmony SDK
        id: setup_sdk
        uses: openharmony-rs/setup-ohos-sdk@v1.0.1
        with:
          version: ${{ inputs.ohos_sdk_version }}
          components: ets

      - name: Sync ArkTS API versions
        run: node scripts/sync-arkts-system-api-versions.mjs "$OHOS_BASE_SDK_HOME/ets/api"

      - name: Check for updates
        id: changes
        shell: bash
        run: |
          if git diff --quiet -- crates/lint/src/arkts/system_api_versions.rs; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "The generated ArkTS API version table is already up to date."
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Create pull request
        if: steps.changes.outputs.changed == 'true'
        uses: peter-evans/create-pull-request@v8
        with:
          add-paths: crates/lint/src/arkts/system_api_versions.rs
          base: ${{ github.event.repository.default_branch }}
          branch: automation/update-arkts-api-versions-${{ steps.setup_sdk.outputs.api-version }}
          delete-branch: true
          commit-message: 'chore(arkts): update API versions from OpenHarmony SDK ${{ inputs.ohos_sdk_version }}'
          title: 'chore(arkts): update API versions from OpenHarmony SDK ${{ inputs.ohos_sdk_version }}'
          body: |
            Update the built-in ArkTS system API version table from OpenHarmony SDK `${{ inputs.ohos_sdk_version }}`.

            - SDK version: `${{ steps.setup_sdk.outputs.sdk-version }}`
            - API version: `${{ steps.setup_sdk.outputs.api-version }}`

            This pull request was generated by the `Update ArkTS API Versions` workflow.
