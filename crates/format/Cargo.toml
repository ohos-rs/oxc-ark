[package]
name = "format"
version = "0.1.0"
edition.workspace = true
authors = ["richerfu<southorange0929@foxmail.com>"]
description = "Reusable multi-language formatter based on oxc"
license.workspace = true

[lints]
workspace = true

[dependencies]
editorconfig-parser = "0.0.4"
rustc-hash = { workspace = true }
oxc_config = { workspace = true }
schemars = { workspace = true }
tracing = { workspace = true }
oxc_formatter_css = { workspace = true }
oxc_formatter_graphql = { workspace = true }
oxc_formatter_markdown = { workspace = true }
oxc_formatter_toml = { workspace = true }
oxc_formatter_yaml = { workspace = true }
oxc_allocator = { workspace = true, features = ["pool"] }
oxc_ast = { workspace = true }
oxc_diagnostics = { workspace = true }
oxc_formatter = { workspace = true }
oxc_formatter_core = { workspace = true }
oxc_parser = { workspace = true }
oxc_span = { workspace = true }
oxc-toml = { workspace = true }
oxc_formatter_json = { workspace = true }
serde = { version = "1", features = ["derive"] }
serde_json = { workspace = true, features = ["unbounded_depth"] }
phf = { workspace = true }
simdutf8 = { workspace = true }
json-strip-comments = { workspace = true }

[target.'cfg(not(target_family = "wasm"))'.dependencies]
fast-glob = { workspace = true }
globset = { workspace = true }
ignore = { workspace = true }
oxc_data_structures = { workspace = true, features = ["rope"] }
oxc_language_server = { workspace = true }
tokio = { workspace = true, features = ["rt-multi-thread", "macros"] }
tower-lsp-server = { workspace = true, features = ["url-fluent-uri"] }

[dependencies.sort-package-json]
version = "1.0"

[dependencies.napi]
workspace = true
optional = true

[dependencies.napi-derive]
workspace = true
optional = true

[features]
default = []
detect_code_removal = ["oxc_formatter/detect_code_removal"]
napi = ["dep:napi", "dep:napi-derive"]
sort-package-json = []

[dev-dependencies]
tempfile = "3"
