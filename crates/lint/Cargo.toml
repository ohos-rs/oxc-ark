[package]
name = "lint"
version = "0.1.0"
edition.workspace = true
authors.workspace = true
description = "Reusable linter based on oxlint"
license.workspace = true

[lints]
workspace = true

[dependencies]
oxlint = { workspace = true }
cow-utils = { workspace = true }
ignore = { workspace = true }
json-strip-comments = { workspace = true }
miette = { workspace = true }
napi = { workspace = true, optional = true }
oxc_allocator = { workspace = true }
oxc_ast = { workspace = true }
oxc_ast_visit = { workspace = true, features = ["serialize"] }
oxc_config = { workspace = true }
oxc_data_structures = { workspace = true, features = ["rope"] }
oxc_diagnostics = { workspace = true }
oxc_language_server = { workspace = true }
oxc_linter = { workspace = true }
oxc_parser = { workspace = true }
oxc_span = { workspace = true }
oxc_str = { workspace = true }
oxc_syntax = { workspace = true }
rayon = { workspace = true }
rustc-hash = { workspace = true }
schemars = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true, features = ["rt-multi-thread"] }
tower-lsp-server = { workspace = true, features = ["proposed"] }
tracing = { workspace = true }

[features]
default = []
napi = [
  "dep:napi",
]
testing = ["oxc_linter/force_test_reporter"]
ruledocs = ["oxc_linter/ruledocs"]
